<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><style>html,body{margin:0;width:100%;height:100%;background:#080809;overflow:hidden}#player,iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#idle{position:absolute;inset:0;display:grid;place-items:center;color:#b2a0ed;font:20px sans-serif;text-align:center;pointer-events:none}</style></head>
<body><div id="player"></div><div id="idle">The room is yours.<br>Add a song to get things going.</div><script>
let player,ready=false,pending=null,current=null,captionsEnabled=false;
function applyCaptions(){
  if(!ready || !player.getOptions)return;
  const loaded=player.getOptions().includes('captions');
  if(!captionsEnabled && loaded && player.unloadModule)player.unloadModule('captions');
  else if(captionsEnabled && !loaded && player.loadModule)player.loadModule('captions');
}
function setCaptions(enabled){captionsEnabled=!!enabled;applyCaptions()}
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{host:'https://www.youtube.com',width:'100%',height:'100%',playerVars:{playsinline:1,controls:1,fs:0,cc_load_policy:0,iv_load_policy:3,rel:0,origin:location.origin,widget_referrer:location.origin},events:{onReady:()=>{ready=true;Qbeat.ready();if(pending)loadTrack(pending.id,pending.paused)},onStateChange:e=>{if(e.data===0&&current)Qbeat.ended(current);if(e.data===1){applyCaptions();Qbeat.playing()}},onApiChange:applyCaptions,onError:e=>Qbeat.error(e.data),onAutoplayBlocked:()=>Qbeat.blocked()}})}
function loadTrack(id,paused){pending={id,paused};if(!ready)return;document.getElementById('idle').style.display='none';current=id;if(paused)player.cueVideoById(id);else player.loadVideoById(id)}
function setPaused(paused){if(!ready)return;if(paused)player.pauseVideo();else if(player.getPlayerState()!==1)player.playVideo()}
function idle(){pending=null;current=null;if(ready)player.stopVideo();document.getElementById('idle').style.display='grid'}
function reportProgress(){if(!ready||!current||!player.getDuration||!player.getCurrentTime)return;const duration=player.getDuration(),elapsed=player.getCurrentTime();if(Number.isFinite(duration)&&Number.isFinite(elapsed))Qbeat.progress(current,elapsed,duration)}
setInterval(reportProgress,500);
</script><script src="https://www.youtube.com/iframe_api" onerror="Qbeat.loadFailed()"></script></body></html>
