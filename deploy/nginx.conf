server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 89.167.98.40;
    ssl_certificate /etc/letsencrypt-qbeat/live/qbeat-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-qbeat/live/qbeat-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
}
