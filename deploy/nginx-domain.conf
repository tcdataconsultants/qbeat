server {
    listen 80;
    listen [::]:80;
    server_name qbeat.stream www.qbeat.stream;
    client_max_body_size 512k;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qbeat-acme;
    }
    location / {
        return 308 https://qbeat.stream$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.qbeat.stream;
    ssl_certificate /etc/letsencrypt-qbeat/live/qbeat-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-qbeat/live/qbeat-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://qbeat.stream$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qbeat.stream;
    ssl_certificate /etc/letsencrypt-qbeat/live/qbeat-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-qbeat/live/qbeat-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
}
